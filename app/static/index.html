<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light"><meta name="robots" content="noindex,nofollow">
  <title>Codex Reset · LeoHub</title>
  <link rel="icon" href="data:,"><link rel="stylesheet" href="/static/style.css?v=20260915">
  <script src="/static/theme.js?v=20260915"></script><script src="/static/app.js?v=20260915" defer></script>
</head>
<body><div class="shell">
<header class="glass">
  <a class="brand" href="https://leohub.cc" aria-label="返回 LeoHub 首页"><span class="brand-mark" aria-hidden="true"><img src="/static/logo.webp" alt=""></span><span>LEOHUB <small>/ Codex Reset</small></span></a>
  <div class="header-actions"><span id="source-status" class="source-status">正在连接</span><time id="clock" aria-label="当前北京时间">--:--</time><button id="theme" type="button" aria-label="切换主题">浅色</button><button id="refresh" type="button">↻ 刷新</button></div>
</header>
<main>
  <div class="page-heading"><h1>Codex Reset</h1><p>全员重置 · 重置卡 · 预告动态</p></div>
  <div id="client-error" class="notice" role="alert" hidden></div>
  <details id="health-details" class="health-strip glass"><summary><span id="health-pill" class="pill yellow"><i></i><span>正在读取状态</span></span><span class="details-label">详情</span></summary><div class="health-grid"><div>源站最近核验<strong id="checked">—</strong></div><div>本地最近连接<strong id="synced">—</strong></div><div>下次检查<strong id="next">—</strong></div><div>连续失败次数<strong id="failures">0</strong></div><div>最近错误<strong id="last-error">无</strong></div></div></details>
  <section id="announcement" class="announcement" aria-labelledby="current-title"><h2 id="current-title">正在读取预告…</h2><p id="current-detail" hidden></p><div id="current-link"></div></section>
  <div class="latest-grid"><section class="card"><div class="card-label"><span class="tiny-icon">↻</span>最近全员重置</div><div id="latest-reset">正在读取…</div></section><section class="card"><div class="card-label"><span class="tiny-icon purple">▤</span>最近重置卡</div><div id="latest-credit">正在读取…</div></section></div>
  <section class="history glass" aria-labelledby="history-title"><div class="history-heading"><h2 id="history-title">历史记录 <span id="count">—</span></h2><div class="filters" aria-label="筛选事件"><button type="button" data-filter="all" aria-pressed="true">全部</button><button type="button" data-filter="direct_reset" aria-pressed="false">全员重置</button><button type="button" data-filter="reset_credit" aria-pressed="false">重置卡</button><button type="button" data-filter="announced" aria-pressed="false">预告</button></div></div><div id="timeline" aria-live="polite"><p class="empty">正在读取事件…</p></div><button id="more" class="load-more" type="button" hidden>加载更多</button></section>
</main>
<footer><span>LEOHUB / Codex Reset</span><a href="https://aihot.news/codex-reset" target="_blank" rel="noopener noreferrer">数据来源 AIHOT ↗</a><p>北京时间 · 确认帖发布时间不等于实际执行时间；仅展示公开事件，不代表个人账户额度。</p></footer>
</div></body></html>
